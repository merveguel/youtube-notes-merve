<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 12px;
      font-family: Roboto, Arial, sans-serif;
      background: #1f1f1f;
      color: #ffffff;
      margin: 0;
      box-sizing: border-box;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 8px;
      cursor: pointer;
      border-radius: 4px;
      border: none;
      font-weight: bold;
      font-size: 13px;
    }
    .export-btn {
      background-color: #2ba640;
      color: #fff;
      margin-bottom: 8px;
    }
    .secondary-btn {
      background-color: #333;
      color: #fff;
      border: 1px solid #444;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h3>YouTube Notes</h3>

  <button id="export-btn" class="export-btn">Export Notes (JSON)</button>
  <button id="open-dashboard-btn" class="secondary-btn">Open Full Dashboard ↗</button>

  <script src="popup.js"></script>
</body>
</html>
