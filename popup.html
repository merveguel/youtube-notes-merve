<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      min-height: 380px;
      padding: 12px;
      font-family: Roboto, Arial, sans-serif;
      background: #1f1f1f;
      color: #ffffff;
      margin: 0;
      box-sizing: border-box;
    }
    textarea {
      width: 100%;
      height: 55px;
      box-sizing: border-box;
      margin-top: 8px;
      background: #121212;
      color: #fff;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 6px;
      resize: vertical;
    }
    button {
      width: 100%;
      margin-top: 6px;
      padding: 8px;
      cursor: pointer;
      border-radius: 4px;
      border: none;
      font-weight: bold;
    }
    .primary-btn { background-color: #3ea6ff; color: #000; }
    .secondary-btn { background-color: #333; color: #fff; border: 1px solid #444; }
    .export-btn { background-color: #2ba640; color: #fff; }
    .note-list {
      margin-top: 10px;
      max-height: 140px;
      overflow-y: auto;
      border-top: 1px solid #333;
      padding-top: 6px;
    }
    .note-item {
      font-size: 12px;
      padding: 4px 0;
      border-bottom: 1px solid #2a2a2a;
      word-break: break-word;
    }
    .timestamp {
      font-weight: bold;
      color: #3ea6ff;
    }
  </style>
</head>
<body>
  <h3 style="margin: 0 0 8px 0; font-size: 15px;">Quick YouTube Note</h3>
  <button id="get-time-btn" class="secondary-btn">Grab Current Timestamp</button>
  <textarea id="note-input" placeholder="Write quick note..."></textarea>
  <button id="save-btn" class="primary-btn">Save Note</button>

  <div class="note-list" id="notes-container"></div>

  <button id="export-btn" class="export-btn">Export Notes (JSON)</button>
  <button id="open-dashboard-btn" class="secondary-btn" style="margin-top: 6px;">Open Full Dashboard ↗</button>

  <script src="popup.js"></script>
</body>
</html>
