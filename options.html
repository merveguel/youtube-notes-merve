<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Notes Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: Roboto, Arial, sans-serif;
      background-color: #181818;
      color: #ffffff;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1000px;
      margin: 0 auto 20px auto;
      padding-bottom: 16px;
      border-bottom: 1px solid #333;
    }
    .header h1 { margin: 0; font-size: 22px; }
    .actions { display: flex; gap: 10px; align-items: center; }
    input[type="text"] {
      width: 280px;
      padding: 8px 12px;
      background: #121212;
      color: #fff;
      border: 1px solid #383838;
      border-radius: 4px;
      font-size: 14px;
    }
    button, .btn-label {
      padding: 8px 14px;
      border-radius: 4px;
      border: none;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-export { background-color: #2ba640; color: #ffffff; }
    .btn-import { background-color: #383838; color: #ffffff; border: 1px solid #555; display: inline-block; }
    button:hover, .btn-label:hover { opacity: 0.9; }
    .container { max-width: 1000px; margin: 0 auto; }
  </style>
</head>
<body>

  <div class="header">
    <h1>YouTube Notes Dashboard</h1>
    <div class="actions">
      <input type="text" id="search-input" placeholder="Search notes or video titles...">
      <button id="export-all-btn" class="btn-export">Export Backup (JSON)</button>
      <label for="import-file-input" class="btn-label btn-import">Import Backup</label>
      <input type="file" id="import-file-input" accept=".json" style="display: none;">
    </div>
  </div>

  <div class="container" id="notes-container">
    <!-- Dynamic notes render here -->
  </div>

  <!-- Dashboard Script -->
  <script src="options.js"></script>
</body>
</html>
