<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube Notes Dashboard</title>
  <style>
    body {
      font-family: Roboto, Arial, sans-serif;
      background: #121212;
      color: #fff;
      padding: 30px;
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      border-bottom: 1px solid #333;
      padding-bottom: 12px;
      font-size: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      gap: 16px;
    }
    .thumbnail-box {
      width: 180px;
      flex-shrink: 0;
    }
    .thumbnail-box img {
      width: 100%;
      border-radius: 6px;
      object-fit: cover;
      aspect-ratio: 16/9;
    }
    .content-box {
      flex-grow: 1;
    }
    .video-title {
      font-size: 17px;
      color: #3ea6ff;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 6px;
    }
    .video-title:hover {
      text-decoration: underline;
    }
    .video-url {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 12px;
      word-break: break-all;
    }
    .note-item {
      margin-top: 6px;
      padding: 8px;
      background: #2a2a2a;
      border-radius: 4px;
      font-size: 13px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .timestamp-link {
      color: #fff;
      font-weight: bold;
      background: #0056b3;
      padding: 2px 6px;
      border-radius: 3px;
      text-decoration: none;
      font-size: 12px;
    }
    .timestamp-link:hover {
      background: #0073e6;
    }
  </style>
</head>
<body>
  <h1>All Saved YouTube Notes</h1>
  <div id="dashboard-container">Loading notes...</div>

  <script src="options.js"></script>
</body>
</html>
